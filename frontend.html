<!DOCTYPE html>
<html>

<head>
    <title>Resume Matcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 15px;
            padding: 8px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Resume-Job Matcher</h1>

    <label>Resume Text:</label>
    <textarea id="resumeInput"></textarea>

    <label>Job Description Text:</label>
    <textarea id="jobInput"></textarea>

    <button onclick="checkMatch()">Check Match</button>

    <div id="result"></div>

    <script>
        async function checkMatch() {
            const resumeText = document.getElementById("resumeInput").value;
            const jobText = document.getElementById("jobInput").value;
            const resultDiv = document.getElementById("result");

            resultDiv.innerHTML = "Checking match...";

            try {
                const response = await fetch("http://127.0.0.1:8000/match", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        resume_text: resumeText,
                        job_description_text: jobText
                    })
                });

                if (!response.ok) {
                    throw new Error("Server responded with an error: " + response.status);
                }

                const data = await response.json();

                resultDiv.innerHTML = `
            <strong>Match Score:</strong> ${(data.match_score * 100).toFixed(1)}%<br>
            <strong>Missing Skills (${data.skill_gap_count}):</strong> ${data.skill_gap_sample.join(", ")}
        `;
            } catch (error) {
                resultDiv.innerHTML = `<span style="color: red;">Error: Could not reach the server. Is it running? (${error.message})</span>`;
            }
        }
    </script>
</body>

</html>
